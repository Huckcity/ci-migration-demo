name: ci-migration-demo
on:
  push:
    branches: ['**']
    tags: ['*']
  pull_request: {}
  workflow_dispatch:
    inputs:
      pipeline:
        description: Custom pipeline to run
        type: choice
        options: [nightly-perf]
        required: true
      TARGET:
        default: staging
        type: choice
        options: [staging, production]
        required: false
env:
  BITBUCKET_COMMIT: ${{ github.sha }}
  BITBUCKET_BUILD_NUMBER: ${{ github.run_number }}
jobs:
  default-build:
    name: default / Build
    runs-on: ubuntu-latest
    if: "!(github.ref == 'refs/heads/main') && github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch'"
    container:
      image: node:20
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Cache node
        uses: actions/cache@v4
        with:
          path: node_modules
          key: "${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}"
      - name: npm ci
        run: |
          npm ci
          npm run build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: default-build-artifacts
          path: 'dist/**'
  default-unit-tests:
    name: default / Unit tests
    runs-on: ubuntu-latest
    needs: [default-build]
    if: "!(github.ref == 'refs/heads/main') && github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch'"
    container:
      image: node:20
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Cache node
        uses: actions/cache@v4
        with:
          path: node_modules
          key: "${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}"
      - name: Download artifacts from Build
        uses: actions/download-artifact@v4
        with:
          name: default-build-artifacts
      - name: npm ci
        run: |
          npm ci
          npm test
  default-lint:
    name: default / Lint
    runs-on: ubuntu-latest
    needs: [default-build]
    if: "!(github.ref == 'refs/heads/main') && github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch'"
    container:
      image: node:20
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download artifacts from Build
        uses: actions/download-artifact@v4
        with:
          name: default-build-artifacts
      - name: npm ci
        run: |
          npm ci
          npm run lint
  main-build:
    name: main / Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    container:
      image: node:20
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Cache node
        uses: actions/cache@v4
        with:
          path: node_modules
          key: "${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}"
      - name: npm ci
        run: |
          npm ci
          npm run build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-build-artifacts
          path: 'dist/**'
  main-integration:
    name: main / Integration
    runs-on: ubuntu-latest
    needs: [main-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    container:
      image: node:20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Cache node
        uses: actions/cache@v4
        with:
          path: node_modules
          key: "${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}"
      - name: Cache cypress
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress
      - name: Download artifacts from Build
        uses: actions/download-artifact@v4
        with:
          name: main-build-artifacts
      - name: npm ci
        run: |
          npm ci
          npm run test:integration
      - name: After script
        if: always()
        run: 'cat logs/*.log'
  main-deploy-to-staging:
    name: main / Deploy to staging
    runs-on: ubuntu-latest
    needs: [main-integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    container:
      image: node:20
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download artifacts from Build
        uses: actions/download-artifact@v4
        with:
          name: main-build-artifacts
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET }}
          aws-region: eu-west-1
      - name: Deploy to S3
        run: aws s3 sync dist s3://my-bucket-staging
  main-deploy-to-production:
    name: main / Deploy to production
    runs-on: ubuntu-latest
    needs: [main-deploy-to-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    container:
      image: node:20
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download artifacts from Build
        uses: actions/download-artifact@v4
        with:
          name: main-build-artifacts
      - name: echo "deploying $BITBUCKET_COMMIT build $BITBUCKET_BUILD_…
        run: |
          echo "deploying $BITBUCKET_COMMIT build $BITBUCKET_BUILD_NUMBER"
          ./deploy.sh production
  pr-build:
    name: pr / Build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    container:
      image: node:20
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Cache node
        uses: actions/cache@v4
        with:
          path: node_modules
          key: "${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}"
      - name: npm ci
        run: |
          npm ci
          npm run build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-build-artifacts
          path: 'dist/**'
  tag-release:
    name: tag / Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    container:
      image: node:20
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: npm ci
        run: npm ci
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  nightly-perf-perf:
    name: nightly-perf / Perf
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.pipeline == 'nightly-perf'
    container:
      image: node:20
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: npm run perf -- --target $TARGET
        run: npm run perf -- --target $TARGET
