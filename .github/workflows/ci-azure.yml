name: ci-migration-demo
run-name: '${{ github.workflow }} #${{ github.run_number }}.${{ github.run_attempt }}'
on:
  push:
    branches: [main, 'release/*']
    paths-ignore: ['docs/*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1-5'
  workflow_dispatch:
    inputs:
      deployTarget:
        description: Deploy target
        required: false
        type: choice
        options: [staging, production]
        default: staging
      runPerf:
        required: false
        type: boolean
        default: false
env:
  buildConfiguration: Release
  artifactDir: ${{ github.workspace }}/_artifacts
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-build:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.imageName }}
    strategy:
      matrix:
        include:
          - name: linux
            imageName: ubuntu-latest
            node: '20'
          - name: windows
            imageName: windows-latest
            node: '18'
      fail-fast: false
    env:
      node: ${{ matrix.node }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node }}
      - name: Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.npm_config_cache }}
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install
        run: npm ci
      - name: Test
        run: npm test -- --reporter=junit
        env:
          CI: 'true'
      - name: Publish test results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: '**/junit.xml'
      - name: Build API
        run: 'dotnet build **/*.csproj --configuration ${{ env.buildConfiguration }}'
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: drop
          path: ${{ env.artifactDir }}
  deploy-deploy:
    name: Deploy / deploy
    runs-on: ubuntu-latest
    needs: [build-build]
    if: (success()) && (github.ref == 'refs/heads/main')
    environment: ${{ inputs.deployTarget }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: drop
          path: ${{ github.workspace }}/_pipeline/drop
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: my-api-${{ inputs.deployTarget }}
          package: ${{ github.workspace }}/_pipeline/drop
      - name: Smoke test
        run: |
          echo "Deployed ${{ github.run_number }} to ${{ inputs.deployTarget }}"
          curl -fsS https://my-api.example.com/health
        shell: bash
  deploy-perf:
    name: Deploy / perf
    runs-on: ubuntu-latest
    needs: [build-build, deploy-deploy]
    if: ((success()) && (github.ref == 'refs/heads/main')) && (inputs.runPerf == true)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: npm run perf
        run: npm run perf
